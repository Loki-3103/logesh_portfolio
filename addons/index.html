<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Logesh T — Portfolio</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Intro animation -->
  <div id="introScreen" class="intro-screen">
    <div class="intro-logo">L</div>
  </div>

  <!-- Who's watching -->
  <div id="profileScreen" class="profile-screen hidden">
    <h2 class="profile-heading">Who's viewing?</h2>
    <div class="profile-row">

      <div class="profile-card" data-profile="recruiter">
        <div class="profile-icon"><img src="images/recruiter.jpg" alt="Recruiter" /></div>
        <span class="profile-label">Recruiter</span>
      </div>

      <div class="profile-card" data-profile="developer">
        <div class="profile-icon"><img src="images/developer.jpg" alt="Developer" /><i class="lock-badge">&#128274;</i></div>
        <span class="profile-label">Developer</span>
      </div>

      <div class="profile-card" data-profile="browsing">
        <div class="profile-icon"><img src="images/just_browsing.jpg" alt="Just browsing" /></div>
        <span class="profile-label">Just browsing</span>
      </div>

    </div>

    <!-- Passcode prompt for Developer profile -->
    <div id="passcodeBox" class="passcode-box hidden">
      <p>Enter passcode</p>
      <input type="password" id="passcodeInput" maxlength="4" />
      <button id="passcodeSubmit">Enter</button>
      <p id="passcodeError" class="passcode-error"></p>
    </div>
  </div>

  <!-- Main site -->
  <div id="mainSite" class="main-site hidden">

    <nav class="navbar" id="navbar">
      <div class="nav-left">
        <a href="#/" class="logo">LOKI</a>
        <div class="nav-links" id="navLinks">
          <a href="#/" class="nav-link active" data-section="home">Home</a>
          <a href="#/projects" class="nav-link" data-section="projects">Projects</a>
          <a href="#/skills" class="nav-link" data-section="skills">Skills</a>
          <a href="#/connect" class="nav-link" data-section="connect">Connect</a>
        </div>
      </div>
      <div class="nav-right">
        <button class="nav-icon-btn" id="searchBtn" aria-label="Search">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </button>
        <button class="nav-icon-btn" id="notifBtn" aria-label="Notifications">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          <span class="notif-badge">2</span>
        </button>
        <div class="nav-avatar-wrap" id="avatarWrap">
          <div class="nav-avatar" id="navAvatar">
            <img src="" alt="Profile" id="avatarImg" />
          </div>
          <svg class="avatar-caret" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
          <div class="avatar-dropdown hidden" id="avatarDropdown">
            <span class="dropdown-name" id="dropdownName"></span>
            <button class="dropdown-switch" id="switchProfileBtn">Switch profile</button>
          </div>
        </div>
      </div>
    </nav>

    <!-- Content rendered by render.js from data.js -->
    <div id="app"></div>

  </div>

  <script src="data.js"></script>
  <script src="render.js"></script>
  <script src="script.js"></script>
</body>
</html>
